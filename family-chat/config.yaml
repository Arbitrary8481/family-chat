name: "Family Chat"
version: "2.0.0"
slug: "family_chat"
description: "Private Discord-like chat for your family with file sharing and emojis"
arch:
  - amd64
  - aarch64
  - armv7
url: "https://github.com/Arbitrary8481/family-chat"
ingress: true
ingress_port: 8099
panel_icon: "mdi:message-text"
panel_title: "Family Chat"
init: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Web interface"
map:
  - share:rw
  - media:rw
options:
  username1: "Family Member 1"
  username2: "Family Member 2"
  theme: "dark"
  max_file_size: 25
  allowed_file_types:
    - image/*
    - video/*
    - audio/*
    - application/pdf
    - text/*
schema:
  username1: str
  username2: str
  theme: list(dark|light)
  max_file_size: int(1,100)
  allowed_file_types:
    - str
